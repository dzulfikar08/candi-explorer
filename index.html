<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore Candi Borobudur in 3D: walk the galleries, follow the pradaksina path, and read about each level." />
    <!-- Revklik analytics (site "Candi Explorer"). Forks: remove or use your own site id. -->
    <script defer data-site-id="8a6321fd-e7f7-4fe7-8d6c-635177894e9a" src="https://app.revklik.com/klikapa.js"></script>
    <title>Candi Explorer · Borobudur</title>
  </head>
  <body>
    <canvas id="scene" role="img" aria-label="3D view of the temple"></canvas>

    <div class="corner">
      <header class="brand">
        <p class="brand-app">Candi Explorer</p>
        <h1 id="candi-name">Borobudur</h1>
        <p id="candi-location" class="brand-location"></p>
        <p class="brand-credit">
          Made by <a href="https://joyodigitama.com" target="_blank" rel="noopener">JoyoDigitama</a> ·
          <a href="https://github.com/dzulfikar08/candi-explorer" target="_blank" rel="noopener">Source</a>
        </p>
      </header>
      <aside id="promo" class="promo" aria-label="More from the makers"></aside>
    </div>

    <div id="hotspots" class="hotspots" role="group" aria-label="Points of interest"></div>

    <aside id="info" class="info" aria-live="polite">
      <button id="info-toggle" class="info-toggle" type="button" aria-expanded="true" aria-controls="info-content">
        Hide notes
      </button>
      <div id="info-content" class="info-content">
        <p id="info-kicker" class="info-kicker"></p>
        <h2 id="info-title"></h2>
        <div id="info-body" class="info-body"></div>
        <dl id="info-facts" class="info-facts"></dl>
        <button id="info-overview" class="link-button" type="button" hidden>Back to overview</button>
      </div>
    </aside>

    <div id="tour-bar" class="tour-bar" hidden>
      <div class="tour-row">
        <button id="tour-play" type="button" class="tool">Pause</button>
        <button id="tour-next" type="button" class="tool">Next section</button>
        <label class="tour-speed">
          Speed
          <select id="tour-speed">
            <option value="1">1×</option>
            <option value="2" selected>2×</option>
            <option value="4">4×</option>
            <option value="8">8×</option>
          </select>
        </label>
        <button id="tour-exit" type="button" class="tool">End tour</button>
      </div>
      <div id="tour-progress" class="tour-progress" role="progressbar" aria-label="Pradaksina progress" aria-valuemin="0" aria-valuemax="100">
        <div id="tour-progress-fill"></div>
      </div>
      <p id="tour-section" class="tour-section"></p>
    </div>

    <nav class="dock" aria-label="View controls">
      <div class="mode-group" role="group" aria-label="Camera mode">
        <button type="button" class="tool" data-mode="orbit" aria-pressed="true">Orbit</button>
        <button type="button" class="tool" data-mode="walk" aria-pressed="false">Walk</button>
        <button type="button" class="tool" data-mode="tour" aria-pressed="false">Pradaksina tour</button>
      </div>
      <button id="realms-toggle" type="button" class="tool" aria-pressed="false">Show three realms</button>
      <label class="time">
        <span>Time <output id="time-label">07:00</output> WIB</span>
        <input id="time" type="range" min="300" max="1140" step="5" value="420" />
      </label>
    </nav>

    <div id="realm-legend" class="legend" hidden>
      <p><span class="swatch swatch-kama"></span>Kamadhatu · base</p>
      <p><span class="swatch swatch-rupa"></span>Rupadhatu · square galleries</p>
      <p><span class="swatch swatch-arupa"></span>Arupadhatu · circular terraces</p>
    </div>

    <div id="walk-hint" class="walk-hint" hidden>
      <p id="walk-hint-text">Click the view to look around. W A S D to walk, Shift to hurry, Esc to release the mouse.</p>
    </div>

    <div id="loading" class="loading">Laying the stones…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

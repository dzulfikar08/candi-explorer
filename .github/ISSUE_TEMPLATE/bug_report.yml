name: Bug report
description: Something renders wrong, breaks, or performs badly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. Screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the site
        2. Start the pradaksina tour
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      multiple: true
      options: [Orbit, Walk, Pradaksina tour, Three realms, Time of day, Other]
  - type: input
    id: env
    attributes:
      label: Browser, OS and device
      placeholder: Chrome 140, Windows 11, laptop with integrated GPU
    validations:
      required: true
